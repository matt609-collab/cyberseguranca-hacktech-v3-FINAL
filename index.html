<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VAI PITANGA - Centro de Comando v6.0</title>
    <meta name="description" content="Centro de Comando e Sistema de Monitoramento e Segurança Autônomo com Drones de Patrulhamento em Pitanga - PR." />
    <meta property="og:title" content="VAI PITANGA - Centro de Comando v6.0" />
    <meta property="og:description" content="Centro de Comando e Sistema de Monitoramento e Segurança Autônomo com Drones de Patrulhamento em Pitanga - PR." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#12161c] text-[#ecf0f1] antialiased">
    <div id="root"></div>

    <!-- =====================================================================
         MÓDULO EXCLUSIVO DE ACESSIBILIDADE UNIVERSAL
         (Visual, Auditiva/Libras, Motora e Sintetizador de Voz)
         ===================================================================== -->

    <!-- 1. ESTILOS CSS DE ACESSIBILIDADE -->
    <style>
        /* 1.1 Indicador de foco amarelo destacado para navegação por TAB */
        *:focus-visible {
            outline: 3px solid #f1c40f !important;
            outline-offset: 3px !important;
        }

        /* 1.2 Classe para texto oculto lido apenas por sintetizadores de voz */
        .sr-only {
            position: absolute !important;
            width: 1px !important;
            height: 1px !important;
            padding: 0 !important;
            margin: -1px !important;
            overflow: hidden !important;
            clip: rect(0, 0, 0, 0) !important;
            white-space: nowrap !important;
            border: 0 !important;
        }

        /* 1.3 Atalho para pular direto ao conteúdo com a tecla TAB */
        .skip-link {
            position: fixed;
            top: -60px;
            left: 10px;
            background: #000;
            color: #f1c40f;
            padding: 10px 16px;
            z-index: 999999;
            font-weight: bold;
            border: 2px solid #f1c40f;
            border-radius: 4px;
            text-decoration: none;
            transition: top 0.2s;
        }
        .skip-link:focus { 
            top: 10px; 
        }

        /* 1.4 Barra Flutuante com Botões Rápidos (A+, A-, Alto Contraste) */
        #painel-acessibilidade-vp {
            position: fixed;
            bottom: 15px;
            left: 15px;
            background: rgba(17, 17, 17, 0.95);
            border: 2px solid #f1c40f;
            border-radius: 8px;
            padding: 8px 12px;
            display: flex;
            gap: 6px;
            align-items: center;
            z-index: 999999;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
        }
        #painel-acessibilidade-vp button {
            background: #2c3e50;
            color: #ffffff;
            border: 1px solid #555;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 11px;
            font-family: sans-serif;
            transition: 0.2s;
        }
        #painel-acessibilidade-vp button:hover {
            background: #f1c40f;
            color: #000000;
        }

        /* 1.5 Modo de Alto Contraste para baixa visão e daltonismo */
        body.modo-alto-contraste {
            background-color: #000000 !important;
            color: #ffffff !important;
        }
        body.modo-alto-contraste * {
            background-color: transparent !important;
            color: #ffffff !important;
            border-color: #ffffff !important;
        }
        body.modo-alto-contraste button, 
        body.modo-alto-contraste a {
            outline: 2px solid #ffff00 !important;
            color: #ffff00 !important;
            font-weight: bold !important;
        }

        /* 1.6 Banner de Alarme Visual no topo para pessoas surdas */
        #banner-alerta-visual {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: #e74c3c;
            color: #ffffff;
            font-weight: 900;
            text-align: center;
            padding: 10px 0;
            font-size: 13px;
            letter-spacing: 1px;
            z-index: 100000;
            box-shadow: 0 4px 15px rgba(231, 76, 60, 0.7);
            animation: piscar-alerta-visual 1s infinite alternate;
        }
        @keyframes piscar-alerta-visual {
            from { background-color: #c0392b; }
            to { background-color: #e74c3c; }
        }
    </style>

    <!-- 2. ELEMENTOS HTML DE ACESSIBILIDADE -->

    <!-- Atalho por teclado -->
    <a href="#map-container" class="skip-link">Pular para o conteúdo principal</a>

    <!-- Banner de emergência visual (substituto visual para sirenes de som) -->
    <div id="banner-alerta-visual" role="alert">
        <span id="txt-alerta-visual">🚨 ALERTA VISUAL: INCIDENTE DETECTADO!</span> 
        <button type="button" onclick="document.getElementById('banner-alerta-visual').style.display='none'" style="margin-left:15px; background:#fff; color:#000; border:none; padding:3px 8px; font-weight:bold; cursor:pointer; border-radius:3px;">Fechar</button>
    </div>

    <!-- Canal de fala para leitores de tela (NVDA, TalkBack, etc.) -->
    <div id="aria-alert-announcer" class="sr-only" aria-live="assertive" aria-atomic="true"></div>

    <!-- Barra flutuante com botões de tamanho de fonte e contraste -->
    <aside id="painel-acessibilidade-vp" aria-label="Ferramentas de Acessibilidade">
        <span style="font-size:11px; color:#f1c40f; font-weight:bold;">Acessibilidade:</span>
        <button type="button" onclick="alterarFonteAcessivel(1)" aria-label="Aumentar tamanho do texto">A+</button>
        <button type="button" onclick="alterarFonteAcessivel(-1)" aria-label="Diminuir tamanho do texto">A-</button>
        <button type="button" onclick="resetarFonteAcessivel()" aria-label="Redefinir tamanho do texto">A Normal</button>
        <button type="button" onclick="alternarContrasteAcessivel()" aria-label="Alternar modo de alto contraste">🌓 Contraste</button>
    </aside>

    <!-- Widget Oficial VLibras (Língua Brasileira de Sinais) -->
    <div vw class="enabled">
        <div vw-access-button class="active"></div>
        <div vw-plugin-wrapper>
            <div class="vw-plugin-top-wrapper"></div>
        </div>
    </div>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
        window.addEventListener('load', function() {
            try {
                if (window.VLibras && window.VLibras.Widget) {
                    new window.VLibras.Widget('https://vlibras.gov.br/app');
                }
            } catch (e) {
                console.warn('VLibras init:', e);
            }
        });
    </script>

    <!-- 3. FUNÇÕES JAVASCRIPT DE ACESSIBILIDADE -->
    <script>
        let nivelFonteGlobal = 100;

        // Aumentar ou diminuir fonte da tela
        function alterarFonteAcessivel(passo) {
            if ((passo > 0 && nivelFonteGlobal < 140) || (passo < 0 && nivelFonteGlobal > 80)) {
                nivelFonteGlobal += passo * 10;
                document.documentElement.style.fontSize = nivelFonteGlobal + "%";
            }
        }

        // Voltar a fonte ao tamanho normal
        function resetarFonteAcessivel() {
            nivelFonteGlobal = 100;
            document.documentElement.style.fontSize = "100%";
        }

        // Ativar / Desativar modo Alto Contraste
        function alternarContrasteAcessivel() {
            document.body.classList.toggle('modo-alto-contraste');
        }

        // Comunicar alertas ao leitor de tela
        function avisarLeitorDeTela(mensagem) {
            const canalVoz = document.getElementById('aria-alert-announcer');
            if (canalVoz) {
                canalVoz.innerText = "";
                setTimeout(() => { canalVoz.innerText = mensagem; }, 100);
            }
        }

        // Disparar o alarme visual piscante na tela
        function dispararAlertaVisual(texto) {
            const banner = document.getElementById('banner-alerta-visual');
            const txt = document.getElementById('txt-alerta-visual');
            if (banner && txt) {
                txt.innerText = "🚨 ALERTA VISUAL: " + texto;
                banner.style.display = 'block';
            }
            avisarLeitorDeTela(texto);
        }

        // Tornar funções acessíveis globalmente
        window.alterarFonteAcessivel = alterarFonteAcessivel;
        window.resetarFonteAcessivel = resetarFonteAcessivel;
        window.alternarContrasteAcessivel = alternarContrasteAcessivel;
        window.avisarLeitorDeTela = avisarLeitorDeTela;
        window.dispararAlertaVisual = dispararAlertaVisual;

        // Navegação por teclado: fechar alertas e modais com a tecla ESC
        document.addEventListener('keydown', function(evento) {
            if (evento.key === "Escape") {
                const banner = document.getElementById('banner-alerta-visual');
                if (banner) banner.style.display = 'none';

                document.querySelectorAll('.modal-dialog, #camera-overlay, #modal-inspecao').forEach(function(modal) {
                    modal.style.display = 'none';
                });
            }
        });
    </script>
    <!-- ===================== FIM DO MÓDULO DE ACESSIBILIDADE ===================== -->

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
